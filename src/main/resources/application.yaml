spring:
  application:
    name: wallet-service

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      pool-name: wallet-pool

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: always

server:
  port: ${PORT:8080}

logging:
  pattern:
    level: %5p [%X{correlationId:-no-correlation-id}]