spring:
  application:
    name: wallet-service

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USER:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      pool-name: wallet-pool

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Map keys containing dots need bracket notation in YAML, otherwise
      # Spring reads them as nested maps and the binding silently does nothing.
      percentiles-histogram:
        "[http.server.requests]": true

server:
  port: ${PORT:8080}

logging:
  pattern:
    level: "%5p [%X{correlationId:-no-correlation-id}]"
  structured:
    format:
      console: ${LOG_FORMAT:ecs}